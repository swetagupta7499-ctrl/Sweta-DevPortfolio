name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down the snake
        run: |
          python3 - <<'EOF'
          import re, glob
          FACTOR = 1.7
          for p in glob.glob("dist/*.svg"):
              s = open(p).read()
              s = re.sub(r"(\d+(?:\.\d+)?)ms", lambda m: str(round(float(m.group(1)) * FACTOR)) + "ms", s)
              open(p, "w").write(s)
          EOF

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
